<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zombie Defense</title>
<!-- Installation sur l'écran d'accueil iPhone (Ajouter à l'écran d'accueil) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zombie Defense">
<meta name="theme-color" content="#0d1b12">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  /* ============ ZOMBIE DEFENSE - styles ============ */
  :root{
    --fond:#0d1b12;        /* vert très sombre (nuit) */
    --panneau:#16281b;     /* panneaux */
    --bord:#2c4a33;
    --texte:#e8f0e4;
    --accent:#9be15d;      /* vert toxique */
    --danger:#ff5a5a;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; background:var(--fond); }
  body{
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    color:var(--texte);
    position:fixed; inset:0;               /* évite le rebond de scroll iOS */
    touch-action:none;
    user-select:none; -webkit-user-select:none;
  }
  #app{ display:flex; flex-direction:column; height:100dvh; width:100vw; }

  /* ---- barre du haut : vies, argent, vague ---- */
  #hud{
    display:flex; justify-content:space-around; align-items:center;
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
    background:linear-gradient(180deg,#1b3122,#13241a);
    border-bottom:2px solid var(--bord);
    box-shadow:0 2px 10px rgba(0,0,0,.5);
    font-weight:700; font-size:17px; z-index:5;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  #hud .stat{ display:flex; align-items:center; gap:5px; }
  #hud button{
    background:none; border:none; font-size:20px; padding:4px 6px; cursor:pointer;
  }
  #hud #btnPause, #hud #btnRecommencer{
    min-width:40px; height:38px; border:1px solid #46634a; border-radius:10px;
    background:linear-gradient(180deg,#243c29,#17271b); color:var(--texte);
    font-size:17px; font-weight:800; padding:0 8px; box-shadow:0 2px 4px rgba(0,0,0,.35);
  }
  #hud #btnRecommencer{ color:#ffd0a0; border-color:#75553b; }
  #hud button:disabled{ opacity:.38; cursor:default; }

  /* ---- zone de jeu ---- */
  #cvwrap{ position:relative; flex:1; overflow:hidden; background:var(--fond); }
  canvas{ display:block; margin:0 auto; touch-action:none; }

  /* bouton de lancement de vague (flottant sur la carte) */
  #waveBtn{
    position:absolute; right:10px; bottom:12px; z-index:4;
    background:linear-gradient(180deg,#b5f27d,#8ccc4a); color:#0d1b12;
    border:none; border-radius:14px;
    font-weight:800; font-size:15px; padding:12px 14px;
    box-shadow:0 3px 0 #5e9430, 0 6px 14px rgba(0,0,0,.45); cursor:pointer;
  }
  #waveBtn:active{ transform:translateY(2px); box-shadow:none; }
  #waveBtn.hidden{ display:none; }

  /* ---- magasin de tours (bas d'écran) ---- */
  #shop{
    display:flex; gap:8px; justify-content:center;
    padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
    background:linear-gradient(0deg,#1b3122,#13241a);
    border-top:2px solid var(--bord); z-index:5;
    box-shadow:0 -2px 10px rgba(0,0,0,.5);
  }
  .tourBtn{
    flex:1; max-width:96px; border-radius:12px; border:2px solid var(--bord);
    background:linear-gradient(180deg,#142a19,#0d1c11); color:var(--texte);
    padding:6px 2px 5px; box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 5px rgba(0,0,0,.35);
    display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer;
  }
  .tourBtn .ico{ font-size:24px; line-height:1.1; }
  .tourBtn .nom{ font-size:10.5px; font-weight:700; }
  .tourBtn .prix{ font-size:11px; color:var(--accent); font-weight:700; }
  .tourBtn.arme{ border-color:var(--accent); background:linear-gradient(180deg,#274d2c,#1a3620); box-shadow:0 0 12px rgba(155,225,93,.35); }   /* tour choisie, prête à poser */
  .tourBtn.chere{ opacity:.45; }                                       /* pas assez d'argent */

  /* ---- panneau d'une tour posée (améliorer / vendre) ---- */
  #panneau{
    position:absolute; left:8px; right:8px; bottom:8px; z-index:6;
    background:var(--panneau); border:2px solid var(--bord); border-radius:14px;
    padding:10px 12px; display:none;
  }
  #panneau.ouvert{ display:block; }
  #panneau .titre{ font-weight:800; margin-bottom:2px; }
  #panneau .infos{ font-size:12.5px; opacity:.85; margin-bottom:8px; }
  #panneau .actions{ display:flex; gap:8px; }
  #panneau button{
    flex:1; border:none; border-radius:10px; padding:9px 4px;
    font-weight:800; font-size:13px; cursor:pointer;
  }
  #btnAmeliorer{ background:var(--accent); color:#0d1b12; }
  #btnAmeliorer:disabled{ opacity:.4; }
  #btnVendre{ background:#3a2a2a; color:#ffb0b0; }
  #btnFermer{ background:#243628; color:var(--texte); flex:0 0 44px; }

  /* ---- écrans (titre / game over) ---- */
  #ecran{
    position:absolute; inset:0; z-index:10;
    background:
      radial-gradient(circle at 78% 12%, rgba(220,235,255,.14), transparent 34%),
      radial-gradient(circle at 50% 115%, rgba(155,225,93,.10), transparent 55%),
      linear-gradient(180deg, rgba(6,12,8,.96), rgba(10,20,13,.97));
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; padding:24px; gap:16px;
  }
  #ecran.hidden{ display:none; }
  #ecran h1{
    font-size:40px; letter-spacing:3px; line-height:1.08; color:var(--accent);
    text-shadow:0 0 26px rgba(155,225,93,.55), 0 3px 0 #2c4a33, 0 6px 14px rgba(0,0,0,.7);
  }
  #ecran .sous{ font-size:15px; opacity:.88; max-width:300px; line-height:1.5; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  #ecran .record{ font-size:13px; color:#ffd76a; font-weight:700; text-shadow:0 0 10px rgba(255,215,106,.4); }
  #ecran button{
    background:linear-gradient(180deg,#b5f27d,#8ccc4a); color:#0d1b12; border:none; border-radius:16px;
    font-size:19px; font-weight:800; letter-spacing:1px; padding:14px 46px; cursor:pointer;
    box-shadow:0 4px 0 #5e9430, 0 8px 20px rgba(0,0,0,.5);
  }
  #ecran button.secondaire{
    background:#243628; color:var(--texte); font-size:15px; padding:11px 30px;
    box-shadow:0 3px 0 #16281b;
  }
  #ecran button:active{ transform:translateY(3px); box-shadow:none; }
  #confirmRestart{
    position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    padding:22px; background:rgba(3,8,5,.78);
  }
  #confirmRestart.hidden{ display:none; }
  #confirmRestart .boite{
    width:min(100%,330px); padding:20px; border:2px solid var(--bord); border-radius:16px;
    background:linear-gradient(180deg,#1b3021,#101d14); text-align:center;
    box-shadow:0 12px 38px rgba(0,0,0,.65);
  }
  #confirmRestart h2{ color:#ffd0a0; font-size:20px; margin-bottom:9px; }
  #confirmRestart p{ font-size:14px; line-height:1.45; opacity:.9; margin-bottom:16px; }
  #confirmRestart .actions{ display:flex; gap:10px; }
  #confirmRestart button{ flex:1; min-height:46px; border:0; border-radius:11px; font-weight:800; font-size:14px; cursor:pointer; }
  #annulerRestart{ background:#263b2a; color:var(--texte); }
  #confirmerRestart{ background:#a64438; color:#fff; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="stat">❤️ <span id="hudVies">15</span></span>
    <span class="stat">💰 <span id="hudArgent">150</span></span>
    <span class="stat">🌊 <span id="hudVague">0</span></span>
    <button id="btnVitesse" title="Vitesse">1×</button>
    <button id="btnSon" title="Son">🔊</button>
    <button id="btnPause" title="Pause" aria-label="Mettre en pause" disabled>Ⅱ</button>
    <button id="btnRecommencer" title="Recommencer à zéro" aria-label="Recommencer à zéro">↻</button>
  </div>

  <div id="cvwrap">
    <canvas id="cv"></canvas>
    <button id="waveBtn" class="hidden"></button>
    <div id="panneau">
      <div class="titre" id="panTitre"></div>
      <div class="infos" id="panInfos"></div>
      <div class="actions">
        <button id="btnAmeliorer"></button>
        <button id="btnVendre"></button>
        <button id="btnFermer">✕</button>
      </div>
    </div>
  </div>

  <div id="shop"></div>

  <div id="ecran"></div>
  <div id="confirmRestart" class="hidden" role="dialog" aria-modal="true" aria-labelledby="restartTitre">
    <div class="boite">
      <h2 id="restartTitre">Recommencer à zéro ?</h2>
      <p>Ta partie en cours et sa sauvegarde seront effacées.</p>
      <div class="actions">
        <button id="annulerRestart">Continuer</button>
        <button id="confirmerRestart">Tout recommencer</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================================================================
   ZOMBIE DEFENSE
   Tower defense en vagues infinies, pensé pour iPhone.
   Tout le jeu tient dans ce fichier : carte, tours, zombies, vagues.
   ================================================================ */

/* ---------------- La carte ---------------- */
const COLS = 8, ROWS = 13;                 // grille : 8 colonnes x 13 lignes
// Le chemin des zombies, en cases (colonne, ligne). Il entre à gauche
// et descend en zigzag jusqu'à la base, en bas à gauche.
const CHEMIN = [
  [-1, 1], [6, 1], [6, 4], [1, 4], [1, 7], [6, 7], [6, 10], [1, 10], [1, 13]
];
// Ensemble des cases du chemin ("col,row") : on ne peut pas construire dessus.
const CASES_CHEMIN = new Set();
for (let i = 0; i < CHEMIN.length - 1; i++) {
  let [c1, r1] = CHEMIN[i], [c2, r2] = CHEMIN[i + 1];
  while (c1 !== c2 || r1 !== r2) {
    if (c1 >= 0 && c1 < COLS && r1 >= 0 && r1 < ROWS) CASES_CHEMIN.add(c1 + ',' + r1);
    c1 += Math.sign(c2 - c1); r1 += Math.sign(r2 - r1);
  }
  if (c2 >= 0 && c2 < COLS && r2 >= 0 && r2 < ROWS) CASES_CHEMIN.add(c2 + ',' + r2);
}

/* ---------------- Les tours ----------------
   rate   = tirs par seconde
   dmg    = dégâts par tir
   range  = portée en cases
   aoe    = rayon de l'explosion (cases)
   slow   = ralentissement appliqué (0.45 = -45% de vitesse)
   chain  = nombre de zombies touchés par la foudre            */
const TOURS = {
  arbalete: { nom: 'Arbalète',    icone: '🏹', prix: 50,  range: 1.9, rate: 3.2, dmg: 8,
              desc: 'Tire très vite.' },
  canon:    { nom: 'Canon',       icone: '💣', prix: 100, range: 2.3, rate: 0.7, dmg: 26, aoe: 0.95,
              desc: 'Gros dégâts de zone.' },
  givre:    { nom: 'Lance-givre', icone: '❄️', prix: 75,  range: 1.8, rate: 1.3, dmg: 4, slow: 0.45, slowDur: 1.8,
              desc: 'Ralentit les zombies.' },
  tesla:    { nom: 'Tesla',       icone: '⚡', prix: 150, range: 2.4, rate: 1.0, dmg: 14, chain: 3,
              desc: 'Foudre en chaîne (3 cibles).' },
};
const NIVEAU_MAX = 5;

/* ---------------- Les zombies ----------------
   speed = cases par seconde, r = rayon (en cases), money = argent à la mort,
   vies  = vies retirées s'il atteint la base                            */
const ZOMBIES = {
  normal: { nom: 'Zombie',  pv: 50,  speed: 1.0,  money: 6,  vies: 1, r: 0.32, coul: '#7ec850', habit: '#6b4a2f' },
  coureur:{ nom: 'Coureur', pv: 34,  speed: 1.9,  money: 5,  vies: 1, r: 0.28, coul: '#d3d94e', habit: '#7a3030' },
  tank:   { nom: 'Tank',    pv: 200, speed: 0.55, money: 16, vies: 2, r: 0.44, coul: '#4a7a3a', habit: '#3a3f4a' },
  boss:   { nom: 'Boss',    pv: 900, speed: 0.5,  money: 80, vies: 5, r: 0.58, coul: '#9b59b6', habit: '#2c2c34' },
};

/* Assombrit ou éclaircit une couleur #rrggbb (f = 0.6 -> plus sombre) */
function nuance(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
  const b = Math.min(255, Math.round((n & 255) * f));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---------------- État du jeu ---------------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let cell = 40;                  // taille d'une case en pixels CSS
let dpr = 1;

let etat = 'titre';             // titre | jeu | fin
let argent = 150, vies = 15, vague = 0, score = 0, tues = 0;
let tours = [];                 // tours posées
let zombies = [];               // zombies en vie
let projectiles = [];           // projectiles en vol
let eclairs = [];               // effets de foudre (tesla)
let textes = [];                // textes flottants "+6$"
let particules = [];            // gerbes de sang, fumée, étincelles
let morts = [];                 // zombies en train de tomber (animation de mort)
let secousse = 0;               // tremblement d'écran quand la base est touchée
let fileSpawn = [];             // zombies restant à faire apparaître
let minuteurSpawn = 0, vagueEnCours = false;
let compteARebours = 0;         // secondes avant la prochaine vague auto
let vitesse = 1;                // 1 ou 2 (bouton 1×/2×)
let son = true;
let enPause = false;             // suspend toute la simulation sans perdre la partie
let choixPose = null;           // type de tour en cours de pose (armé via le magasin)
let tourSel = null;             // tour sélectionnée sur la carte
let record = +(localStorage.getItem('zd_record') || 0);

/* ---------------- Sauvegarde de la partie en cours ----------------
   La partie est enregistrée dans le navigateur : fermer et rouvrir
   le jeu permet de reprendre là où on en était (au début de vague). */
const CLE_SAVE = 'zd_save';
function sauvegarder() {
  if (etat !== 'jeu') return;
  const data = {
    argent, vies, vague, score, tues, son,
    tours: tours.map(t => ({ type: t.type, c: t.c, r: t.r, niveau: t.niveau })),
  };
  try { localStorage.setItem(CLE_SAVE, JSON.stringify(data)); } catch (e) {}
}
function lireSauvegarde() {
  try {
    const d = JSON.parse(localStorage.getItem(CLE_SAVE) || 'null');
    if (d && d.vague > 0 && Array.isArray(d.tours)) return d;
  } catch (e) {}
  return null;
}
function effacerSauvegarde() { try { localStorage.removeItem(CLE_SAVE); } catch (e) {} }
window.addEventListener('pagehide', sauvegarder);
document.addEventListener('visibilitychange', () => { if (document.hidden) sauvegarder(); });

/* ---------------- Réglage de la taille du canvas ---------------- */
function redimensionner() {
  const wrap = document.getElementById('cvwrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  cell = Math.floor(Math.min(w / COLS, h / ROWS));
  const cssW = cell * COLS, cssH = cell * ROWS;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // repositionne le canvas verticalement au centre s'il reste de la place
  cv.style.marginTop = Math.max(0, (h - cssH) / 2) + 'px';
  construireCheminPixels();
}
window.addEventListener('resize', redimensionner);

/* Points du chemin en pixels (centres des cases), de l'entrée à la base */
let cheminPx = [];
function construireCheminPixels() {
  cheminPx = CHEMIN.map(([c, r]) => [(c + 0.5) * cell, (r + 0.5) * cell]);
}
function centreCase(c, r) { return [(c + 0.5) * cell, (r + 0.5) * cell]; }

/* ---------------- Décors : pierres tombales, croix, arbres morts (fixes) -- */
const tombes = [];
const croix = [];
const arbres = [];
const touffes = [];             // touffes d'herbe
const etoiles = [];             // étoiles au-dessus de la carte (décor de nuit)
const lucioles = [];            // lucioles qui dérivent
(function () {
  let graine = 1337;
  const alea = () => (graine = (graine * 16807) % 2147483647) / 2147483647;
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    if (CASES_CHEMIN.has(c + ',' + r)) continue;
    const t = alea();
    if (t < 0.10) tombes.push({ c, r, dx: (alea() - 0.5) * 0.5, dy: (alea() - 0.5) * 0.5, t: alea(), incl: (alea() - 0.5) * 0.35 });
    else if (t < 0.16) croix.push({ c, r, dx: (alea() - 0.5) * 0.5, dy: (alea() - 0.5) * 0.5, incl: (alea() - 0.5) * 0.5, t: alea() });
    else if (t < 0.20) arbres.push({ c, r, dx: (alea() - 0.5) * 0.4, dy: (alea() - 0.5) * 0.4, t: alea() });
    else if (t < 0.55) touffes.push({ c, r, dx: (alea() - 0.5) * 0.8, dy: (alea() - 0.5) * 0.8, t: alea() });
  }
  for (let i = 0; i < 40; i++) etoiles.push({ x: alea(), y: alea(), r: 0.4 + alea() * 1.1, p: alea() * 7 });
  for (let i = 0; i < 7; i++) lucioles.push({ x: alea(), y: alea(), p: alea() * 7, v: 0.5 + alea() });
})();

/* ---------------- Le son (mini synthèse WebAudio, aucun fichier) --------- */
let actx = null;
function initSon() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function bip(freq, duree, type, vol) {
  if (!son || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.04, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (duree || 0.08));
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (duree || 0.08));
  } catch (e) {}
}
const SON_TIR = { arbalete: () => bip(880, 0.05, 'square', 0.02),
                  canon:    () => bip(120, 0.25, 'sawtooth', 0.06),
                  givre:    () => bip(1400, 0.12, 'sine', 0.03),
                  tesla:    () => bip(2200, 0.07, 'square', 0.025) };

/* ---------------- Construction d'une vague ----------------
   Les vagues sont infinies : ça monte, ça monte...            */
function compositionVague(n) {
  const liste = [];
  const nb = 8 + Math.floor(n * 2.8 + Math.max(0, n - 4) * 1.25 + Math.max(0, n - 8) * 2.5);
  for (let i = 0; i < nb; i++) {
    let t = 'normal';
    if (n >= 2 && i % 4 === 2) t = 'coureur';
    if (n >= 4 && i % 6 === 5) t = 'tank';
    if (n >= 7 && i % 7 === 3) t = 'coureur';
    if (n >= 10 && i % 9 === 6) t = 'tank';
    liste.push(t);
  }
  if (n % 10 === 0) {             // un boss toutes les 10 vagues
    liste.push('boss');
    if (n >= 10) liste.push('boss');   // deux boss à partir de la vague 10
  }
  return liste;
}

function lancerVague() {
  vague++;
  fileSpawn = compositionVague(vague);
  minuteurSpawn = 0;
  vagueEnCours = true;
  compteARebours = 0;
  majBoutonVague();
  majHud();
  sauvegarder();
  bip(300, 0.3, 'sawtooth', 0.05);
}

/* ---------------- Placement et sélection des tours ---------------- */
function caseAuDoigt(x, y) {
  const rect = cv.getBoundingClientRect();
  const c = Math.floor((x - rect.left) / cell);
  const r = Math.floor((y - rect.top) / cell);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
  return [c, r];
}
function tourSur(c, r) { return tours.find(t => t.c === c && t.r === r); }
function prixAmelioration(t) { return Math.round(TOURS[t.type].prix * 0.7 * t.niveau); }
function investi(t) {
  let total = TOURS[t.type].prix;
  for (let n = 1; n < t.niveau; n++) total += Math.round(TOURS[t.type].prix * 0.7 * n);
  return total;
}

cv.addEventListener('pointerdown', (e) => {
  if (etat !== 'jeu') return;
  initSon();
  const pos = caseAuDoigt(e.clientX, e.clientY);
  if (!pos) return;
  const [c, r] = pos;

  if (choixPose) {
    // mode pose : on construit si la case est libre
    const def = TOURS[choixPose];
    if (!CASES_CHEMIN.has(c + ',' + r) && !tourSur(c, r) && argent >= def.prix) {
      argent -= def.prix;
      const [x, y] = centreCase(c, r);
      tours.push({ type: choixPose, c, r, x, y, niveau: 1, recharge: 0, angle: -Math.PI / 2, recul: 0 });
      bip(500, 0.1, 'triangle', 0.05);
      choixPose = null; majShop();
      majHud(); sauvegarder();
    } else {
      bip(160, 0.15, 'square', 0.04);   // case invalide
    }
    fermerPanneau();
    return;
  }

  // sinon : sélection d'une tour existante
  const t = tourSur(c, r);
  if (t) ouvrirPanneau(t); else fermerPanneau();
});

/* ---------------- Panneau améliorer / vendre ---------------- */
const panneau = document.getElementById('panneau');
function ouvrirPanneau(t) {
  tourSel = t;
  const def = TOURS[t.type];
  document.getElementById('panTitre').textContent = def.icone + ' ' + def.nom + ' · niv. ' + t.niveau;
  document.getElementById('panInfos').textContent =
    'Dégâts ' + Math.round(def.dmg * Math.pow(1.35, t.niveau - 1)) +
    ' · Portée ' + (def.range + 0.12 * (t.niveau - 1)).toFixed(1) +
    ' · Cadence ' + (def.rate * Math.pow(1.1, t.niveau - 1)).toFixed(1) + '/s';
  const btnA = document.getElementById('btnAmeliorer');
  if (t.niveau >= NIVEAU_MAX) {
    btnA.textContent = 'Niveau max'; btnA.disabled = true;
  } else {
    const prix = prixAmelioration(t);
    btnA.textContent = '⬆ Améliorer (' + prix + '$)';
    btnA.disabled = argent < prix;
  }
  document.getElementById('btnVendre').textContent = 'Vendre +' + Math.round(investi(t) * 0.7) + '$';
  panneau.classList.add('ouvert');
}
function fermerPanneau() { tourSel = null; panneau.classList.remove('ouvert'); }
document.getElementById('btnFermer').onclick = fermerPanneau;
document.getElementById('btnAmeliorer').onclick = () => {
  if (!tourSel) return;
  const prix = prixAmelioration(tourSel);
  if (tourSel.niveau < NIVEAU_MAX && argent >= prix) {
    argent -= prix; tourSel.niveau++;
    bip(700, 0.12, 'triangle', 0.05);
    ouvrirPanneau(tourSel); majHud(); majShop(); sauvegarder();
  }
};
document.getElementById('btnVendre').onclick = () => {
  if (!tourSel) return;
  argent += Math.round(investi(tourSel) * 0.7);
  tours = tours.filter(t => t !== tourSel);
  bip(350, 0.1, 'triangle', 0.04);
  fermerPanneau(); majHud(); majShop(); sauvegarder();
};

/* ---------------- Le magasin ---------------- */
const shop = document.getElementById('shop');
function construireShop() {
  shop.innerHTML = '';
  for (const [type, def] of Object.entries(TOURS)) {
    const b = document.createElement('button');
    b.className = 'tourBtn';
    b.innerHTML = '<span class="ico">' + def.icone + '</span>' +
                  '<span class="nom">' + def.nom + '</span>' +
                  '<span class="prix">' + def.prix + '$</span>';
    b.title = def.desc;
    b.onclick = () => {
      initSon();
      choixPose = (choixPose === type) ? null : type;   // tap = armer / désarmer

      majShop();

    b.dataset.type = type;
    shop.appendChild(b);
  }
}
function majShop() {
  for (const b of shop.children) {
    const def = TOURS[b.dataset.type];
    b.classList.toggle('arme', choixPose === b.dataset.type);
    b.classList.toggle('chere', argent < def.prix);
  }
}

/* ---------------- Mécanique du jeu ---------------- */
function faireApparaitre(type) {
  const def = ZOMBIES[type];
  // La difficulté reste progressive au début, puis s'accélère après la vague 4.
  const palierInitial = Math.min(vague - 1, 3) * 0.40;
  const palierTardif = Math.max(0, vague - 4) * 0.75 + Math.max(0, vague - 8) * 0.50;
  const pvMax = Math.round(def.pv * (1 + palierInitial + palierTardif));
  zombies.push({
    type, x: cheminPx[0][0], y: cheminPx[0][1],
    pv: pvMax, pvMax,
    speed: def.speed, money: Math.max(2, Math.round(def.money * (1 - Math.min(0.50, Math.max(0, vague - 4) * 0.03)))), vies: def.vies, r: def.r * cell,
    segment: 0, avancee: 0,          // position sur le chemin
    lent: 0,                          // temps de ralentissement restant
    marche: Math.random() * 7,        // phase du cycle de marche
    flash: 0,                         // flash blanc quand il est touché
  });
}

function majZombies(dt) {
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    if (z.lent > 0) z.lent -= dt;
    if (z.flash > 0) z.flash -= dt * 6;
    const v = z.speed * (z.lent > 0 ? 1 - TOURS.givre.slow : 1) * cell; // px/s
    z.marche += (v / cell) * dt * 7;   // fait avancer l'animation de marche
    let reste = v * dt;
    // avance le long des segments du chemin
    while (reste > 0 && z.segment < cheminPx.length - 1) {
      const [tx, ty] = cheminPx[z.segment + 1];
      const dx = tx - z.x, dy = ty - z.y;
      const d = Math.hypot(dx, dy);
      if (d <= reste) {
        z.x = tx; z.y = ty; z.segment++; reste -= d;
      } else {
        z.x += dx / d * reste; z.y += dy / d * reste; reste = 0;
      }
      z.avancee += 1;   // sert à viser le zombie le plus avancé
    }
    if (z.segment >= cheminPx.length - 1) {
      // le zombie a atteint la base
      vies -= z.vies;
      zombies.splice(i, 1);
      secousse = 0.35;
      bip(90, 0.4, 'sawtooth', 0.08);
      majHud();
      if (vies <= 0) { partieTerminee(); return; }
    }
  }
}

function tuerZombie(z, index) {
  argent += z.money; tues++; score += z.money + vague;
  textes.push({ x: z.x, y: z.y - z.r, txt: '+' + z.money + '$', vie: 0.8 });
  // animation de mort : le zombie bascule et disparaît
  morts.push({ x: z.x, y: z.y, r: z.r, type: z.type, coul: ZOMBIES[z.type].coul, gel: z.lent > 0, vie: 0.55, sens: Math.random() < 0.5 ? 1 : -1 });
  // gerbe de sang verdâtre
  for (let k = 0; k < 8; k++) {
    const a = Math.random() * Math.PI * 2, v = (0.5 + Math.random()) * cell * 2.2;
    particules.push({ x: z.x, y: z.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - cell,
      vie: 0.4 + Math.random() * 0.3, taille: 1.5 + Math.random() * 2.5,
      coul: Math.random() < 0.6 ? '#5d9430' : '#3a5c1e' });
  }
  zombies.splice(index, 1);
  bip(180 + Math.random() * 120, 0.1, 'triangle', 0.03);
  majHud(); majShop();
}

function majTours(dt) {
  for (const t of tours) {
    const def = TOURS[t.type];
    const range = (def.range + 0.12 * (t.niveau - 1)) * cell;
    const dmg = def.dmg * Math.pow(1.35, t.niveau - 1);
    const rate = def.rate * Math.pow(1.1, t.niveau - 1);
    t.recharge -= dt;
    if (t.recul > 0) t.recul -= dt * 6;
    // cible : le zombie le plus avancé à portée
    let cible = null, meilleur = -1;
    for (const z of zombies) {
      const d = Math.hypot(z.x - t.x, z.y - t.y);
      if (d <= range + z.r && z.avancee > meilleur) { meilleur = z.avancee; cible = z; }
    }
    if (cible) t.angle = Math.atan2(cible.y - t.y, cible.x - t.x);
    if (cible && t.recharge <= 0) {
      t.recharge = 1 / rate;
      t.recul = 1;
      SON_TIR[t.type]();
      // éclair de bouche au bout de l'arme
      const mx = t.x + Math.cos(t.angle) * cell * 0.42, my = t.y + Math.sin(t.angle) * cell * 0.42;
      if (t.type !== 'tesla') particules.push({ x: mx, y: my, vx: 0, vy: 0, vie: 0.09, taille: cell * 0.16, coul: '#ffd76a', flash: true });
      if (t.type === 'tesla') {
        // foudre en chaîne : touche jusqu'à `chain` zombies proches
        let touches = [cible], dernier = cible;
        for (let k = 1; k < def.chain; k++) {
          let suiv = null, dmin = 1.6 * cell;
          for (const z of zombies) {
            if (touches.includes(z)) continue;
            const d = Math.hypot(z.x - dernier.x, z.y - dernier.y);
            if (d < dmin) { dmin = d; suiv = z; }
          }
          if (!suiv) break;
          touches.push(suiv); dernier = suiv;
        }
        eclairs.push({ pts: [[t.x, t.y], ...touches.map(z => [z.x, z.y])], vie: 0.12 });
        for (const z of touches) infligerDegats(z, dmg);
      } else if (t.type === 'givre') {
        projectiles.push({ x: t.x, y: t.y, cible, dmg, type: t.type, speed: 7 * cell });
      } else {
        projectiles.push({ x: t.x, y: t.y, cible, dmg, type: t.type, speed: (t.type === 'canon' ? 5 : 10) * cell });
      }
    }
  }
}

function infligerDegats(z, dmg) {
  z.pv -= dmg;
  z.flash = 1;                      // petit flash blanc à l'impact
  const i = zombies.indexOf(z);
  if (z.pv <= 0 && i !== -1) tuerZombie(z, i);
}

function majProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (!zombies.includes(p.cible)) { projectiles.splice(i, 1); continue; }
    const dx = p.cible.x - p.x, dy = p.cible.y - p.y;
    const d = Math.hypot(dx, dy);
    const pas = p.speed * dt;
    if (d <= pas + p.cible.r) {
      // touche !
      if (p.type === 'canon') {
        const def = TOURS.canon;
        const aoe = def.aoe * cell;
        eclairs.push({ pts: [[p.cible.x, p.cible.y]], vie: 0.18, boom: true, rayon: aoe });
        for (const z of [...zombies]) {
          if (Math.hypot(z.x - p.cible.x, z.y - p.cible.y) <= aoe + z.r) infligerDegats(z, p.dmg);
        }
        // fumée de l'explosion
        for (let k = 0; k < 6; k++) {
          const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * cell;
          particules.push({ x: p.cible.x, y: p.cible.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - cell * 0.6,
            vie: 0.5 + Math.random() * 0.3, taille: 3 + Math.random() * 4, coul: 'rgba(90,85,80,0.5)', fumee: true });
        }
        bip(80, 0.3, 'sawtooth', 0.07);
      } else {
        if (p.type === 'givre') p.cible.lent = TOURS.givre.slowDur;
        infligerDegats(p.cible, p.dmg);
      }
      projectiles.splice(i, 1);
    } else {
      p.x += dx / d * pas; p.y += dy / d * pas;
      // le boulet laisse une traînée de fumée
      if (p.type === 'canon' && Math.random() < 0.6)
        particules.push({ x: p.x, y: p.y, vx: 0, vy: -cell * 0.3, vie: 0.3, taille: 2 + Math.random() * 2.5, coul: 'rgba(120,115,110,0.35)', fumee: true });
    }
  }
}

/* ---------------- Boucle principale ---------------- */
let dernierTemps = 0;
function boucle(t) {
  requestAnimationFrame(boucle);
  if (etat !== 'jeu' || enPause) { dernierTemps = t; return; }
  let dt = Math.min((t - dernierTemps) / 1000, 0.1) * vitesse;
  dernierTemps = t;

  // apparition des zombies de la vague
  if (vagueEnCours && fileSpawn.length) {
    minuteurSpawn -= dt;
    if (minuteurSpawn <= 0) {
      faireApparaitre(fileSpawn.shift());
      minuteurSpawn = Math.max(0.14, 0.96 - vague * 0.05 - Math.max(0, vague - 4) * 0.06);
    }
  }
  // fin de vague -> compte à rebours avant la suivante
  if (vagueEnCours && !fileSpawn.length && !zombies.length) {
    vagueEnCours = false;
    compteARebours = 7;
    majBoutonVague();
  }
  if (!vagueEnCours) {
    compteARebours -= dt;
    if (compteARebours <= 0) lancerVague();
    else majBoutonVague();
  }

  majZombies(dt);
  if (etat !== 'jeu') return;   // la partie peut se terminer dans majZombies
  majTours(dt);
  majProjectiles(dt);
  for (let i = eclairs.length - 1; i >= 0; i--) { eclairs[i].vie -= dt; if (eclairs[i].vie <= 0) eclairs.splice(i, 1); }
  for (let i = textes.length - 1; i >= 0; i--)  { textes[i].vie -= dt;  textes[i].y -= 30 * dt; if (textes[i].vie <= 0) textes.splice(i, 1); }
  for (let i = particules.length - 1; i >= 0; i--) {
    const p = particules[i];
    p.vie -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (!p.flash) p.vy += cell * 3.5 * dt;   // gravité (sauf les éclairs de bouche)
    if (p.vie <= 0) particules.splice(i, 1);
  }
  for (let i = morts.length - 1; i >= 0; i--) { morts[i].vie -= dt; if (morts[i].vie <= 0) morts.splice(i, 1); }
  if (secousse > 0) secousse -= dt;
  for (const l of lucioles) {                 // lucioles qui dérivent doucement
    l.p += dt * l.v;
    l.x += Math.sin(l.p * 0.7) * dt * 0.02;
    l.y += Math.cos(l.p * 0.5) * dt * 0.015;
  }

  dessiner();
}

/* ---------------- Dessin ---------------- */
function dessiner() {
  const W = cell * COLS, H = cell * ROWS;

  ctx.save();
  if (secousse > 0) {   // tremblement quand la base est touchée
    ctx.translate((Math.random() - 0.5) * secousse * 22, (Math.random() - 0.5) * secousse * 22);
  }

  // herbe de nuit
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a3520'); g.addColorStop(0.6, '#122517'); g.addColorStop(1, '#0b1710');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // damier discret pour lire la grille
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++)
    if ((c + r) % 2 === 0) ctx.fillRect(c * cell, r * cell, cell, cell);

  // touffes d'herbe
  ctx.strokeStyle = 'rgba(70,110,60,0.5)'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  for (const tf of touffes) {
    const [x, y] = centreCase(tf.c, tf.r);
    const px = x + tf.dx * cell, py = y + tf.dy * cell;
    ctx.beginPath();
    ctx.moveTo(px, py); ctx.lineTo(px - 2.5, py - 4 - tf.t * 3);
    ctx.moveTo(px, py); ctx.lineTo(px + 0.5, py - 5 - tf.t * 3);
    ctx.moveTo(px, py); ctx.lineTo(px + 3, py - 3.5 - tf.t * 3);
    ctx.stroke();
  }

  // lune avec halo et cratères
  ctx.save();
  const lx = W - cell * 0.7, ly = cell * 0.55;
  const halo = ctx.createRadialGradient(lx, ly, cell * 0.2, lx, ly, cell * 1.4);
  halo.addColorStop(0, 'rgba(220,235,255,0.28)'); halo.addColorStop(1, 'rgba(220,235,255,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(lx, ly, cell * 1.4, 0, 7); ctx.fill();
  ctx.shadowColor = 'rgba(230,240,255,.8)'; ctx.shadowBlur = cell * 0.9;
  ctx.fillStyle = '#e9f2ff';
  ctx.beginPath(); ctx.arc(lx, ly, cell * 0.32, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(170,190,210,0.5)';
  ctx.beginPath(); ctx.arc(lx - cell * 0.09, ly - cell * 0.05, cell * 0.06, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(lx + cell * 0.08, ly + cell * 0.09, cell * 0.045, 0, 7); ctx.fill();
  ctx.restore();

  // le chemin (terre battue)
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#54402c'; ctx.lineWidth = cell * 0.84;
  tracerChemin();
  ctx.strokeStyle = '#6d563e'; ctx.lineWidth = cell * 0.74;
  tracerChemin();
  ctx.strokeStyle = '#7d6647'; ctx.lineWidth = cell * 0.5;
  tracerChemin();
  // traces de pas au centre
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 2;
  ctx.setLineDash([5, 11]); tracerChemin(); ctx.setLineDash([]);

  // l'entrée des zombies : une grille de cimetière rouillée
  const [ex, ey] = centreCase(0, 1);
  ctx.fillStyle = '#05080a';
  ctx.fillRect(0, ey - cell * 0.48, cell * 0.22, cell * 0.96);
  ctx.strokeStyle = '#39424a'; ctx.lineWidth = 2.5;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(1, ey + i * cell * 0.3); ctx.lineTo(cell * 0.2, ey + i * cell * 0.3); ctx.stroke();
  }

  // pierres tombales (certaines penchées, avec RIP)
  for (const tb of tombes) {
    const [x, y] = centreCase(tb.c, tb.r);
    const px = x + tb.dx * cell, py = y + tb.dy * cell;
    ctx.save();
    ctx.translate(px, py); ctx.rotate(tb.incl);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, cell * 0.16, cell * 0.2, cell * 0.06, 0, 0, 7); ctx.fill();
    ctx.fillStyle = tb.t > 0.5 ? '#66767d' : '#4d5a61';
    ctx.beginPath();
    ctx.moveTo(-cell * 0.16, cell * 0.15);
    ctx.lineTo(-cell * 0.16, -cell * 0.06);
    ctx.arc(0, -cell * 0.06, cell * 0.16, Math.PI, 0);
    ctx.lineTo(cell * 0.16, cell * 0.15);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.font = 'bold ' + (cell * 0.11) + 'px serif'; ctx.textAlign = 'center';
    ctx.fillText('RIP', 0, cell * 0.02);
    ctx.restore();
  }

  // croix en bois
  for (const cr of croix) {
    const [x, y] = centreCase(cr.c, cr.r);
    const px = x + cr.dx * cell, py = y + cr.dy * cell;
    ctx.save();
    ctx.translate(px, py); ctx.rotate(cr.incl);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, cell * 0.17, cell * 0.13, cell * 0.045, 0, 0, 7); ctx.fill();
    ctx.fillStyle = cr.t > 0.5 ? '#5d4a33' : '#4a3a28';
    ctx.fillRect(-cell * 0.035, -cell * 0.2, cell * 0.07, cell * 0.37);
    ctx.fillRect(-cell * 0.12, -cell * 0.11, cell * 0.24, cell * 0.06);
    ctx.restore();
  }

  // arbres morts
  for (const ar of arbres) {
    const [x, y] = centreCase(ar.c, ar.r);
    const px = x + ar.dx * cell, py = y + ar.dy * cell;
    ctx.strokeStyle = '#241a12'; ctx.lineCap = 'round';
    ctx.lineWidth = cell * 0.09;
    ctx.beginPath(); ctx.moveTo(px, py + cell * 0.3); ctx.lineTo(px, py - cell * 0.22); ctx.stroke();
    ctx.lineWidth = cell * 0.05;
    ctx.beginPath();
    ctx.moveTo(px, py - cell * 0.05); ctx.lineTo(px - cell * (0.18 + ar.t * 0.1), py - cell * 0.28);
    ctx.moveTo(px, py - cell * 0.12); ctx.lineTo(px + cell * (0.16 + ar.t * 0.12), py - cell * 0.32);
    ctx.stroke();
  }

  // la base (la maison à protéger)
  const [bx, by] = centreCase(1, 12);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(bx, by + cell * 0.38, cell * 0.55, cell * 0.14, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#7d2b2b';   // murs
  ctx.fillRect(bx - cell * 0.4, by - cell * 0.15, cell * 0.8, cell * 0.5);
  ctx.fillStyle = '#5e1f1f';   // toit
  ctx.beginPath();
  ctx.moveTo(bx - cell * 0.5, by - cell * 0.13);
  ctx.lineTo(bx, by - cell * 0.52);
  ctx.lineTo(bx + cell * 0.5, by - cell * 0.13);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a1414';   // porte
  ctx.fillRect(bx - cell * 0.08, by + cell * 0.08, cell * 0.16, cell * 0.27);
  // fenêtre allumée
  ctx.save();
  ctx.shadowColor = 'rgba(255,210,110,.9)'; ctx.shadowBlur = cell * 0.25;
  ctx.fillStyle = '#ffd76a';
  ctx.fillRect(bx + cell * 0.14, by - cell * 0.02, cell * 0.14, cell * 0.14);
  ctx.restore();
  ctx.strokeStyle = '#3a1414'; ctx.lineWidth = 1.5;
  ctx.strokeRect(bx + cell * 0.14, by - cell * 0.02, cell * 0.14, cell * 0.14);
  ctx.fillStyle = '#ffd76a'; ctx.font = 'bold ' + (cell * 0.28) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 4;
  ctx.fillText('BASE', bx, by + cell * 0.72);
  ctx.restore();

  // aperçu de pose (case survolée)
  // (pas de survol au tactile : l'aperçu est le cercle de portée sous le doigt au moment du tap)

  // tours
  for (const t of tours) dessinerTour(t);

  // portée de la tour sélectionnée
  if (tourSel) {
    const def = TOURS[tourSel.type];
    ctx.fillStyle = 'rgba(155,225,93,0.12)';
    ctx.strokeStyle = 'rgba(155,225,93,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(tourSel.x, tourSel.y, (def.range + 0.12 * (tourSel.niveau - 1)) * cell, 0, 7);
    ctx.fill(); ctx.stroke();
  }

  // zombies
  for (const z of zombies) dessinerZombie(z);

  // projectiles
  for (const p of projectiles) {
    if (p.type === 'canon') {
      // boulet avec lueur incandescente
      ctx.save();
      ctx.shadowColor = 'rgba(255,150,50,.9)'; ctx.shadowBlur = cell * 0.2;
      ctx.fillStyle = '#1c1c22';
      ctx.beginPath(); ctx.arc(p.x, p.y, cell * 0.13, 0, 7); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,170,70,.9)';
      ctx.beginPath(); ctx.arc(p.x - cell * 0.03, p.y - cell * 0.03, cell * 0.05, 0, 7); ctx.fill();
    } else if (p.type === 'givre') {
      // éclat de glace
      const ang = Math.atan2(p.cible.y - p.y, p.cible.x - p.x);
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(ang);
      ctx.shadowColor = 'rgba(159,231,255,.8)'; ctx.shadowBlur = cell * 0.15;
      ctx.fillStyle = '#c9f1ff';
      ctx.beginPath();
      ctx.moveTo(cell * 0.14, 0); ctx.lineTo(-cell * 0.06, cell * 0.07); ctx.lineTo(-cell * 0.06, -cell * 0.07);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else {
      // carreau d'arbalète : tige + pointe + empennage
      const ang = Math.atan2(p.cible.y - p.y, p.cible.x - p.x);
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(ang);
      ctx.strokeStyle = '#c9a86a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-cell * 0.14, 0); ctx.lineTo(cell * 0.08, 0); ctx.stroke();
      ctx.fillStyle = '#e8e8e8';
      ctx.beginPath();
      ctx.moveTo(cell * 0.16, 0); ctx.lineTo(cell * 0.05, cell * 0.045); ctx.lineTo(cell * 0.05, -cell * 0.045);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#d8dee8'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-cell * 0.14, 0); ctx.lineTo(-cell * 0.2, cell * 0.05);
      ctx.moveTo(-cell * 0.14, 0); ctx.lineTo(-cell * 0.2, -cell * 0.05);
      ctx.stroke();
      ctx.restore();
    }
  }

  // effets : foudre et explosions
  for (const e of eclairs) {
    if (e.boom) {
      const a = e.vie / 0.18;
      ctx.fillStyle = 'rgba(255,' + Math.round(140 + 100 * a) + ',60,' + (0.45 * a) + ')';
      ctx.beginPath(); ctx.arc(e.pts[0][0], e.pts[0][1], e.rayon * (1.2 - 0.4 * a), 0, 7); ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(170,220,255,' + (e.vie / 0.12) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < e.pts.length - 1; i++) {
        const [x1, y1] = e.pts[i], [x2, y2] = e.pts[i + 1];
        ctx.moveTo(x1, y1);
        // zigzag pour l'effet éclair
        const seg = 4;
        for (let s = 1; s <= seg; s++) {
          const k = s / seg;
          const jx = s === seg ? 0 : (Math.random() - 0.5) * cell * 0.3;
          const jy = s === seg ? 0 : (Math.random() - 0.5) * cell * 0.3;
          ctx.lineTo(x1 + (x2 - x1) * k + jx, y1 + (y2 - y1) * k + jy);
        }
      }
      ctx.stroke();
    }
  }

  // textes flottants "+6$"
  for (const tx of textes) {
    ctx.globalAlpha = Math.min(1, tx.vie / 0.4);
    ctx.fillStyle = '#ffd76a';
    ctx.font = 'bold ' + (cell * 0.34) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 4;
    ctx.fillText(tx.txt, tx.x, tx.y);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // zombies en train de tomber (animation de mort)
  for (const m of morts) {
    const a = m.vie / 0.55;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.sens * (1 - a) * Math.PI / 2);   // bascule sur le côté
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = m.gel ? '#7fc8d8' : m.coul;
    ctx.beginPath(); ctx.arc(0, 0, m.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // particules (sang, fumée, éclairs de bouche)
  for (const p of particules) {
    const a = Math.max(0, Math.min(1, p.vie / 0.3));
    if (p.flash) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.vie / 0.09);
      ctx.shadowColor = p.coul; ctx.shadowBlur = p.taille;
      ctx.fillStyle = p.coul;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.taille, 0, 7); ctx.fill();
      ctx.restore();
    } else {
      ctx.globalAlpha = p.fumee ? a * 0.6 : a;
      ctx.fillStyle = p.coul;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.taille * (p.fumee ? (1.6 - a * 0.6) : 1), 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // lucioles
  for (const l of lucioles) {
    const pulse = 0.4 + 0.6 * Math.abs(Math.sin(l.p * 1.7));
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.shadowColor = '#d8f7a0'; ctx.shadowBlur = 6;
    ctx.fillStyle = '#e4f9a8';
    ctx.beginPath(); ctx.arc(l.x * W, l.y * H, 1.6, 0, 7); ctx.fill();
    ctx.restore();
  }

  // vignette d'ambiance (coins sombres)
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  ctx.restore();   // fin de la secousse
}

function tracerChemin() {
  ctx.beginPath();
  ctx.moveTo(cheminPx[0][0], cheminPx[0][1]);
  for (let i = 1; i < cheminPx.length; i++) ctx.lineTo(cheminPx[i][0], cheminPx[i][1]);
  ctx.stroke();
}

function dessinerTour(t) {
  const s = cell;
  const recul = Math.max(0, t.recul) * s * 0.07;   // recul du canon / de l'arme au tir

  // socle en pierre
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(t.x, t.y + s * 0.34, s * 0.38, s * 0.12, 0, 0, 7); ctx.fill();
  const sg = ctx.createLinearGradient(t.x, t.y - s * 0.4, t.x, t.y + s * 0.4);
  sg.addColorStop(0, '#4a5c50'); sg.addColorStop(1, '#2c3a30');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(t.x, t.y, s * 0.4, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1c281e'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#22301f';
  ctx.beginPath(); ctx.arc(t.x, t.y, s * 0.3, 0, 7); ctx.fill();

  ctx.save();
  ctx.translate(t.x, t.y);
  if (t.type === 'arbalete') {
    // arbalète montée sur pivot, orientée vers la cible
    ctx.rotate(t.angle);
    ctx.translate(-recul, 0);
    ctx.fillStyle = '#5d4a33';                                  // pivot
    ctx.fillRect(-s * 0.1, -s * 0.06, s * 0.16, s * 0.12);
    ctx.fillStyle = '#8a5a2b';                                  // fût
    ctx.fillRect(-s * 0.02, -s * 0.045, s * 0.4, s * 0.09);
    ctx.strokeStyle = '#3d2c18'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-s * 0.02, -s * 0.045, s * 0.4, s * 0.09);
    ctx.strokeStyle = '#caa96a'; ctx.lineWidth = 3;             // arc
    ctx.beginPath(); ctx.arc(s * 0.3, 0, s * 0.24, -1.15, 1.15); ctx.stroke();
    ctx.strokeStyle = 'rgba(230,230,220,0.85)'; ctx.lineWidth = 1.2;  // corde
    ctx.beginPath();
    ctx.moveTo(s * 0.3 + Math.cos(-1.15) * s * 0.24, Math.sin(-1.15) * s * 0.24);
    ctx.lineTo(s * 0.06, 0);
    ctx.lineTo(s * 0.3 + Math.cos(1.15) * s * 0.24, Math.sin(1.15) * s * 0.24);
    ctx.stroke();
    ctx.fillStyle = '#d8d8d8';                                  // carreau armé
    ctx.beginPath();
    ctx.moveTo(s * 0.42, 0); ctx.lineTo(s * 0.3, s * 0.035); ctx.lineTo(s * 0.3, -s * 0.035);
    ctx.closePath(); ctx.fill();
  } else if (t.type === 'canon') {
    ctx.rotate(t.angle);
    ctx.translate(-recul, 0);
    ctx.fillStyle = '#454550';                                  // fût du canon
    ctx.fillRect(-s * 0.05, -s * 0.13, s * 0.5, s * 0.26);
    ctx.fillStyle = '#2c2c34';
    ctx.fillRect(s * 0.32, -s * 0.145, s * 0.12, s * 0.29);     // bouche évasée
    ctx.strokeStyle = '#15151a'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-s * 0.05, -s * 0.13, s * 0.5, s * 0.26);
    ctx.strokeStyle = '#6a6a78'; ctx.lineWidth = 2;             // bandes de métal
    ctx.beginPath();
    ctx.moveTo(s * 0.08, -s * 0.13); ctx.lineTo(s * 0.08, s * 0.13);
    ctx.moveTo(s * 0.24, -s * 0.13); ctx.lineTo(s * 0.24, s * 0.13);
    ctx.stroke();
    ctx.fillStyle = '#33333c';                                  // culasse
    ctx.beginPath(); ctx.arc(-s * 0.04, 0, s * 0.17, 0, 7); ctx.fill();
    ctx.strokeStyle = '#15151a'; ctx.lineWidth = 1.5; ctx.stroke();
  } else if (t.type === 'givre') {
    // cristaux de glace sur un rocher, avec reflet animé
    const puls = 1 + Math.sin(performance.now() / 400 + t.c) * 0.05;
    ctx.fillStyle = '#8f9aa2';
    ctx.beginPath(); ctx.arc(0, s * 0.14, s * 0.2, 0, 7); ctx.fill();
    ctx.save();
    ctx.scale(puls, puls);
    ctx.shadowColor = 'rgba(159,231,255,.7)'; ctx.shadowBlur = s * 0.12;
    ctx.fillStyle = '#9fe7ff';
    ctx.beginPath();                                            // cristal central
    ctx.moveTo(0, -s * 0.36); ctx.lineTo(s * 0.14, s * 0.05); ctx.lineTo(-s * 0.14, s * 0.05);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7fd4f2';
    ctx.beginPath();                                            // cristaux latéraux
    ctx.moveTo(-s * 0.2, -s * 0.12); ctx.lineTo(-s * 0.1, s * 0.1); ctx.lineTo(-s * 0.28, s * 0.1);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s * 0.2, -s * 0.12); ctx.lineTo(s * 0.28, s * 0.1); ctx.lineTo(s * 0.1, s * 0.1);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.85)';                    // éclat
    ctx.beginPath(); ctx.arc(-s * 0.04, -s * 0.14, s * 0.04, 0, 7); ctx.fill();
  } else if (t.type === 'tesla') {
    // bobine tesla : base bois, spires cuivre, orbe qui crépite
    ctx.fillStyle = '#5d4a33';
    ctx.fillRect(-s * 0.14, s * 0.08, s * 0.28, s * 0.1);
    ctx.strokeStyle = '#b8722e'; ctx.lineWidth = 2.5;           // spires
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(-s * 0.09, s * 0.06 - i * s * 0.075);
      ctx.lineTo(s * 0.09, s * 0.06 - i * s * 0.075);
      ctx.stroke();
    }
    ctx.fillStyle = '#6a4a8a';
    ctx.fillRect(-s * 0.045, -s * 0.2, s * 0.09, s * 0.28);
    ctx.save();
    ctx.shadowColor = 'rgba(170,220,255,.9)'; ctx.shadowBlur = s * 0.18;
    ctx.fillStyle = '#dfe9ff';                                  // orbe
    ctx.beginPath(); ctx.arc(0, -s * 0.27, s * 0.13, 0, 7); ctx.fill();
    ctx.restore();
    if (Math.random() < 0.3) {                                  // petits arcs électriques
      ctx.strokeStyle = 'rgba(170,220,255,.95)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -s * 0.27);
      let ax = 0, ay = -s * 0.27;
      for (let k = 0; k < 3; k++) {
        ax += (Math.random() - 0.5) * s * 0.3; ay += (Math.random() - 0.5) * s * 0.3;
        ctx.lineTo(ax, ay);
      }
      ctx.stroke();
    }
  }
  ctx.restore();

  // pépites de niveau sous la tour
  if (t.niveau > 1) {
    ctx.fillStyle = '#ffd76a';
    for (let i = 0; i < t.niveau; i++) {
      ctx.beginPath();
      ctx.arc(t.x - (t.niveau - 1) * s * 0.055 + i * s * 0.11, t.y + s * 0.42, s * 0.035, 0, 7);
      ctx.fill();
    }
  }
}

function dessinerZombie(z) {
  const def = ZOMBIES[z.type];
  const r = z.r;
  const gel = z.lent > 0;
  const peau = gel ? '#8fd0de' : def.coul;
  const peauFonce = gel ? '#5fa8ba' : nuance(def.coul, 0.72);
  const habit = gel ? nuance(def.habit, 1.25) : def.habit;
  // Le sprite reste debout à l'écran, même quand le chemin tourne.
  const m = z.marche;
  const bob = Math.abs(Math.sin(m)) * r * 0.08;         // rebond de marche
  const balancement = Math.sin(m);                       // jambes / bras

  // ombre portée
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(z.x, z.y + r * 0.8, r * 0.95, r * 0.32, 0, 0, 7); ctx.fill();

  ctx.save();
  ctx.translate(z.x, z.y - bob);
  const largeur = z.type === 'tank' ? 1.3 : (z.type === 'coureur' ? 0.85 : 1);
  ctx.scale(largeur, 1);

  // jambes (cycle de marche)
  ctx.strokeStyle = nuance(def.habit, 0.7); ctx.lineWidth = r * 0.3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-r * 0.22, r * 0.3);
  ctx.lineTo(-r * 0.22 + balancement * r * 0.35, r * 0.85);
  ctx.moveTo(r * 0.22, r * 0.3);
  ctx.lineTo(r * 0.22 - balancement * r * 0.35, r * 0.85);
  ctx.stroke();

  // bras tendus en avant (vers +y, sa direction), qui se balancent
  ctx.strokeStyle = peau; ctx.lineWidth = r * 0.24;
  ctx.beginPath();
  ctx.moveTo(-r * 0.5, -r * 0.15);
  ctx.lineTo(-r * 0.45 + balancement * r * 0.15, r * 0.72);
  ctx.moveTo(r * 0.5, -r * 0.15);
  ctx.lineTo(r * 0.45 - balancement * r * 0.15, r * 0.72);
  ctx.stroke();
  ctx.fillStyle = peauFonce;   // mains
  ctx.beginPath(); ctx.arc(-r * 0.45 + balancement * r * 0.15, r * 0.78, r * 0.15, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.45 - balancement * r * 0.15, r * 0.78, r * 0.15, 0, 7); ctx.fill();

  // torse (vêtement en lambeaux)
  ctx.fillStyle = habit;
  ctx.beginPath(); ctx.ellipse(0, r * 0.05, r * 0.62, r * 0.58, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = nuance(def.habit, 0.6); ctx.lineWidth = r * 0.09;   // déchirures
  ctx.beginPath();
  ctx.moveTo(-r * 0.3, -r * 0.2); ctx.lineTo(-r * 0.1, r * 0.1);
  ctx.moveTo(r * 0.25, -r * 0.05); ctx.lineTo(r * 0.35, r * 0.25);
  ctx.stroke();
  if (z.type === 'tank') {   // plaques d'épaule du tank
    ctx.fillStyle = '#565c68';
    ctx.beginPath(); ctx.arc(-r * 0.55, -r * 0.28, r * 0.2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.55, -r * 0.28, r * 0.2, 0, 7); ctx.fill();
  }

  // tête
  const inclinaison = z.type === 'coureur' ? r * 0.18 : 0;   // le coureur se penche en avant
  ctx.fillStyle = peau;
  ctx.beginPath(); ctx.arc(0, -r * 0.72 + inclinaison, r * 0.48, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = peauFonce;   // mâchoire
  ctx.beginPath(); ctx.arc(0, -r * 0.52 + inclinaison, r * 0.26, 0.2, Math.PI - 0.2); ctx.fill();
  if (z.type === 'normal') {   // restes de cheveux
    ctx.fillStyle = '#2e3d24';
    ctx.beginPath(); ctx.arc(0, -r * 0.85, r * 0.42, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  }
  // yeux rouges luisants
  ctx.save();
  ctx.shadowColor = '#ff3030'; ctx.shadowBlur = r * 0.3;
  ctx.fillStyle = '#ff4040';
  ctx.beginPath(); ctx.arc(-r * 0.18, -r * 0.78 + inclinaison, r * 0.09, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.18, -r * 0.78 + inclinaison, r * 0.09, 0, 7); ctx.fill();
  ctx.restore();
  // dents
  ctx.fillStyle = '#e8e4d0';
  ctx.fillRect(-r * 0.14, -r * 0.55 + inclinaison, r * 0.09, r * 0.08);
  ctx.fillRect(r * 0.05, -r * 0.55 + inclinaison, r * 0.09, r * 0.08);

  // couronne du boss
  if (z.type === 'boss') {
    ctx.fillStyle = '#ffd76a';
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const ax = (i - 1) * r * 0.3;
      ctx.moveTo(ax - r * 0.13, -r * 1.1);
      ctx.lineTo(ax, -r * 1.42);
      ctx.lineTo(ax + r * 0.13, -r * 1.1);
    }
    ctx.fill();
    ctx.strokeStyle = '#a8852a'; ctx.lineWidth = 1; ctx.stroke();
  }

  // gangivre gelé : couche de glace
  if (gel) {
    ctx.fillStyle = 'rgba(180,230,255,0.28)';
    ctx.beginPath(); ctx.arc(0, 0, r * 1.05, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(220,245,255,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-r * 0.7, -r * 0.3); ctx.lineTo(-r * 0.45, r * 0.1);
    ctx.moveTo(r * 0.6, -r * 0.5); ctx.lineTo(r * 0.4, 0);
    ctx.stroke();
  }

  // flash blanc quand il est touché
  if (z.flash > 0) {
    ctx.globalAlpha = Math.min(0.75, z.flash);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, -r * 0.1, r * 1.05, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // barre de vie
  if (z.pv < z.pvMax) {
    const w = r * 2.2;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(z.x - w / 2 - 1, z.y - r * 1.75 - 1, w + 2, 6);
    ctx.fillStyle = z.pv / z.pvMax > 0.4 ? '#7ec850' : '#ff5a5a';
    ctx.fillRect(z.x - w / 2, z.y - r * 1.75, w * Math.max(0, z.pv / z.pvMax), 4);
  }
}

/* ---------------- Écrans titre / game over ---------------- */
const ecran = document.getElementById('ecran');
function ecranTitre() {
  etat = 'titre'; enPause = false; majBoutonPause();
  const save = lireSauvegarde();
  ecran.classList.remove('hidden');
  ecran.innerHTML =
    '<h1>🧟 ZOMBIE<br>DEFENSE</h1>' +
    '<div class="sous">Défends ta base contre des vagues infinies de zombies.<br>' +
    'Pose des arbalètes, des canons, du givre et des bobines tesla.<br>' +
    'Chaque zombie tué rapporte de l\'argent. Tiens le plus longtemps possible !</div>' +
    (record ? '<div class="record">🏆 Record : vague ' + record + '</div>' : '') +
    (save ? '<button id="btnReprendre">▶ REPRENDRE · VAGUE ' + (save.vague + 1) + '</button>' : '') +
    '<button id="btnJouer"' + (save ? ' class="secondaire"' : '') + '>' + (save ? 'NOUVELLE PARTIE' : 'JOUER') + '</button>';
  document.getElementById('btnJouer').onclick = () => { initSon(); effacerSauvegarde(); nouvellePartie(); };
  if (save) document.getElementById('btnReprendre').onclick = () => { initSon(); reprendrePartie(); };
}
function reprendrePartie() {
  const d = lireSauvegarde();
  if (!d) { nouvellePartie(); return; }
  argent = d.argent; vies = d.vies; vague = d.vague; score = d.score; tues = d.tues;
  son = d.son !== false;
  document.getElementById('btnSon').textContent = son ? '🔊' : '🔇';
  tours = d.tours.map(t => {
    const [x, y] = centreCase(t.c, t.r);
    return { type: t.type, c: t.c, r: t.r, x, y, niveau: t.niveau, recharge: 0, angle: -Math.PI / 2, recul: 0 };
  });
  zombies = []; projectiles = []; eclairs = []; textes = [];
  particules = []; morts = []; secousse = 0;
  fileSpawn = []; vagueEnCours = false; compteARebours = 5;
  choixPose = null; tourSel = null; vitesse = 1; enPause = false;
  document.getElementById('btnVitesse').textContent = '1×';
  ecran.classList.add('hidden');
  etat = 'jeu';
  majBoutonPause(); majHud(); majShop(); majBoutonVague();
}
function partieTerminee() {
  etat = 'fin'; enPause = false; majBoutonPause();
  effacerSauvegarde();   // la partie est finie : rien à reprendre
  const nvRecord = vague > record;
  if (nvRecord) { record = vague; localStorage.setItem('zd_record', record); }
  bip(70, 1, 'sawtooth', 0.09);
  waveBtn.classList.add('hidden');
  fermerPanneau();
  ecran.classList.remove('hidden');
  ecran.innerHTML =
    '<h1>💀 PARTIE<br>TERMINÉE</h1>' +
    '<div class="sous">Tu as tenu jusqu\'à la <b>vague ' + vague + '</b><br>' +
    tues + ' zombies éliminés · score ' + score + '</div>' +
    (nvRecord ? '<div class="record">🏆 Nouveau record !</div>' : '<div class="record">🏆 Record : vague ' + record + '</div>') +
    '<button id="btnRejouer">REJOUER</button>';
  document.getElementById('btnRejouer').onclick = () => { initSon(); nouvellePartie(); };
}
function nouvellePartie() {
  argent = 150; vies = 15; vague = 0; score = 0; tues = 0;
  tours = []; zombies = []; projectiles = []; eclairs = []; textes = [];
  particules = []; morts = []; secousse = 0;
  fileSpawn = []; vagueEnCours = false; compteARebours = 5;
  choixPose = null; tourSel = null; vitesse = 1; enPause = false;
  document.getElementById('btnVitesse').textContent = '1×';
  ecran.classList.add('hidden');
  etat = 'jeu';
  majBoutonPause(); majHud(); majShop(); majBoutonVague();
}

/* ---------------- Démarrage ---------------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
construireShop();
redimensionner();
setTimeout(redimensionner, 100);   // iOS ajuste parfois la hauteur au chargement
ecranTitre();
requestAnimationFrame(boucle);
</script>
